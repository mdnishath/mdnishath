<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 286" width="588" height="286" role="img" aria-label="Headless E-commerce Boilerplate">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="588" height="272" rx="20"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#22D3EE" stop-opacity="1"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<style>
.k{font:700 12.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#CBD5E1;letter-spacing:1px}
.t{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#F1F5F9;letter-spacing:-.3px}
.d{font:400 16.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#94A3B8}
.tg{font:600 13.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#CBD5E1}
.f{font:500 13.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#64748B}
.glow{animation:glow 7s ease-in-out infinite}
.arrow{animation:nudge 2.4s ease-in-out infinite}
.dot{animation:pulse 2s ease-out infinite}
@keyframes glow{0%,100%{opacity:.22}50%{opacity:.4}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes pulse{0%{r:4;opacity:.8}100%{r:11;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="588" height="272" fill="url(#card)"/>
<circle class="glow" cx="568" cy="-10" r="260" fill="url(#gl)"/>
<rect width="588" height="3" fill="url(#top)"/>
<rect x="28" y="30" width="52" height="52" rx="15" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".5"/>
<g transform="translate(42 44)"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z M3 6h18 M16 10a4 4 0 0 1-8 0" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(453 42)">
<rect width="107" height="28" rx="14" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".14"/>
<text class="k" x="12" y="18.5">OPEN SOURCE</text>
</g>
<text class="t" x="28" y="122">Headless E-commerce Boilerplate</text>
<text class="d" x="28" y="152">White-label storefront on a headless WooCommerce backend.</text><text class="d" x="28" y="176">Multi-client, i18n and multi-currency out of the box.</text>
<g transform="translate(28 220)"><rect width="105" height="28" rx="14" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text class="tg" x="52.5" y="18.5" text-anchor="middle">Next.js 15</text></g><g transform="translate(141 220)"><rect width="89" height="28" rx="14" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text class="tg" x="44.5" y="18.5" text-anchor="middle">React 19</text></g><g transform="translate(238 220)"><rect width="105" height="28" rx="14" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".35"/><text class="tg" x="52.5" y="18.5" text-anchor="middle">WooGraphQL</text></g>
<g transform="translate(536 234)">
<circle r="17" fill="#22D3EE" fill-opacity=".14" stroke="#22D3EE" stroke-opacity=".5"/>
<g class="arrow"><path d="M-7 0h12 M1 -5l5 5-5 5" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x=".75" y=".75" width="586.5" height="270.5" rx="20" fill="none" stroke="#243049" stroke-width="1.5"/>
</g>
</svg>
