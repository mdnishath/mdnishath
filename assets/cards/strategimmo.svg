<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 286" width="588" height="286" role="img" aria-label="STRATEGiMMO">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F472B6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="588" height="272" rx="20"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#F472B6" stop-opacity="1"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
</defs>
<style>
.k{font:700 12.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#CBD5E1;letter-spacing:1px}
.t{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#F1F5F9;letter-spacing:-.3px}
.d{font:400 16.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#94A3B8}
.tg{font:600 13.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#CBD5E1}
.f{font:500 13.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#64748B}
.glow{animation:glow 7s ease-in-out infinite}
.arrow{animation:nudge 2.4s ease-in-out infinite}
.dot{animation:pulse 2s ease-out infinite}
@keyframes glow{0%,100%{opacity:.22}50%{opacity:.4}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes pulse{0%{r:4;opacity:.8}100%{r:11;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="588" height="272" fill="url(#card)"/>
<circle class="glow" cx="568" cy="-10" r="260" fill="url(#gl)"/>
<rect width="588" height="3" fill="url(#top)"/>
<rect x="28" y="30" width="52" height="52" rx="15" fill="#F472B6" fill-opacity=".14" stroke="#F472B6" stroke-opacity=".5"/>
<g transform="translate(42 44)"><path d="M3 21h18 M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16 M9 7h2 M13 7h2 M9 11h2 M13 11h2 M9 15h2 M13 15h2" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(490 42)">
<rect width="70" height="28" rx="14" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".14"/>
<circle class="dot" cx="16" cy="14" r="4" fill="#34D399"/><circle cx="16" cy="14" r="4" fill="#34D399"/>
<text class="k" x="28" y="18.5">LIVE</text>
</g>
<text class="t" x="28" y="122">STRATEGiMMO</text>
<text class="d" x="28" y="152">Immersive 3D concept for a network of 11 estate agencies in</text><text class="d" x="28" y="176">Normandy — scroll-driven cinematic tour and a real 3D map of</text><text class="d" x="28" y="200">the region.</text>
<g transform="translate(28 220)"><rect width="162" height="28" rx="14" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".35"/><text class="tg" x="81" y="18.5" text-anchor="middle">React Three Fiber</text></g><g transform="translate(198 220)"><rect width="57" height="28" rx="14" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".35"/><text class="tg" x="28.5" y="18.5" text-anchor="middle">GSAP</text></g><g transform="translate(263 220)"><rect width="105" height="28" rx="14" fill="#F472B6" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".35"/><text class="tg" x="52.5" y="18.5" text-anchor="middle">Next.js 16</text></g>
<g transform="translate(536 234)">
