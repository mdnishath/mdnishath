<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 286" width="588" height="286" role="img" aria-label="MyPeptideGuide.ai">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131C33"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="588" height="272" rx="20"/></clipPath>
<radialGradient id="gl"><stop offset="0" stop-color="#34D399" stop-opacity="1"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
</defs>
<style>
.k{font:700 12.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#CBD5E1;letter-spacing:1px}
.t{font:800 25px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#F1F5F9;letter-spacing:-.3px}
.d{font:400 16.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:#94A3B8}
.tg{font:600 13.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#CBD5E1}
.f{font:500 13.5px 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;fill:#64748B}
.glow{animation:glow 7s ease-in-out infinite}
.arrow{animation:nudge 2.4s ease-in-out infinite}
.dot{animation:pulse 2s ease-out infinite}
@keyframes glow{0%,100%{opacity:.22}50%{opacity:.4}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@keyframes pulse{0%{r:4;opacity:.8}100%{r:11;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)">
<rect width="588" height="272" fill="url(#card)"/>
<circle class="glow" cx="568" cy="-10" r="260" fill="url(#gl)"/>
<rect width="588" height="3" fill="url(#top)"/>
<rect x="28" y="30" width="52" height="52" rx="15" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/>
<g transform="translate(42 44)"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20 M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(490 42)">
<rect width="70" height="28" rx="14" fill="#FFFFFF" fill-opacity=".05" stroke="#FFFFFF" stroke-opacity=".14"/>
<circle class="dot" cx="16" cy="14" r="4" fill="#34D399"/><circle cx="16" cy="14" r="4" fill="#34D399"/>
<text class="k" x="28" y="18.5">LIVE</text>
</g>
<text class="t" x="28" y="122">MyPeptideGuide.ai</text>
<text class="d" x="28" y="152">A free guide to the published evidence on peptides. Filters</text><text class="d" x="28" y="176">and explains the research; never recommends.</text>
<g transform="translate(28 220)"><rect width="105" height="28" rx="14" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".35"/><text class="tg" x="52.5" y="18.5" text-anchor="middle">Next.js 16</text></g><g transform="translate(141 220)"><rect width="73" height="28" rx="14" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".35"/><text class="tg" x="36.5" y="18.5" text-anchor="middle">Vitest</text></g><g transform="translate(222 220)"><rect width="105" height="28" rx="14" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".35"/><text class="tg" x="52.5" y="18.5" text-anchor="middle">Playwright</text></g>
<g transform="translate(536 234)">
<circle r="17" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-opacity=".5"/>
<g class="arrow"><path d="M-7 0h12 M1 -5l5 5-5 5" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x=".75" y=".75" width="586.5" height="270.5" rx="20" fill="none" stroke="#243049" stroke-width="1.5"/>
</g>
</svg>
