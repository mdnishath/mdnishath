</style>
<rect x="0" y="12" width="52" height="34" rx="10" fill="#7C3AED" fill-opacity=".12" stroke="#7C3AED" stroke-opacity=".45"/>
<text class="n" x="26" y="35" text-anchor="middle">01</text>
<text class="t" x="70" y="42">About</text>
<text class="s" x="71" y="72">Who I am and how I work</text>
<rect x="204" y="29" width="996" height="2" rx="1" fill="url(#l)"/>
<g clip-path="url(#c)"><rect class="sw" x="44" y="28" width="160" height="4" rx="2" fill="url(#s)"/></g>
</svg>
